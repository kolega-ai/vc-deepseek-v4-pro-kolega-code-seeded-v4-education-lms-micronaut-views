<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Reset your password · ${orgName}|">Reset your password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v=${assetVersion})}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="brand-row">
            <span class="brand-mark">B</span>
            <span>
                <span class="brand-name" style="font-family: var(--font-display); font-size: 1.15rem; color: var(--ink-900);">Brightpath</span>
                <span class="brand-sub" th:text="${orgName}" style="display:block; font-size:0.72rem; color: var(--ink-500);">Brightpath Academy</span>
            </span>
        </div>
        <h1>Reset your password</h1>
        <p class="auth-sub">Enter your account email. If it is registered, we will email you a single-use reset link valid for 60 minutes.</p>
        <form th:action="@{/password/forgot}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrf}">
            <div class="field">
                <label for="email">Email</label>
                <input class="input" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
        </form>
        <div class="auth-foot">
            Remembered it? <a th:href="@{/login}">Back to sign in</a>
        </div>
    </div>
</div>
</body>
</html>
