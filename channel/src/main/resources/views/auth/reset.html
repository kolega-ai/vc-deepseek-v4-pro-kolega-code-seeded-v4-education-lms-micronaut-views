<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Choose a new password · ${orgName}|">Choose a new password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v=${assetVersion})}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="brand-row">
            <span class="brand-mark">B</span>
            <span>
                <span class="brand-name" style="font-family: var(--font-display); font-size: 1.15rem; color: var(--ink-900);">Brightpath</span>
                <span class="brand-sub" th:text="${orgName}" style="display:block; font-size:0.72rem; color: var(--ink-500);">Brightpath Academy</span>
            </span>
        </div>
        <h1>Choose a new password</h1>
        <p class="auth-sub">This link is single-use and expires after 60 minutes.</p>
        <form th:action="@{/password/reset}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrf}">
            <input type="hidden" name="token" th:value="${token}">
            <div class="field">
                <label for="password">New password</label>
                <input class="input" type="password" id="password" name="password" required autocomplete="new-password"
                       minlength="10" title="At least 10 characters with uppercase, lowercase and a digit">
                <div class="hint">At least 10 characters, including uppercase, lowercase and a digit.</div>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input class="input" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Update password</button>
        </form>
        <div class="auth-foot">
            <a th:href="@{/login}">Back to sign in</a>
        </div>
    </div>
</div>
</body>
</html>
