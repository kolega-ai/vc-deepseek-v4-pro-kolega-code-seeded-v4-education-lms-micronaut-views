allprojects {
    group = 'com.brightpath'
    version = '1.0.0'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters', '-XprintProcessorInfo']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
